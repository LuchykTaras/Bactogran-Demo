<!DOCTYPE html>
<html lang="uk">
<head>
  <base target="_top">

  <title>
    Bactogran Field Advisor — Цифровий помічник
  </title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <style>
    :root {
      --blue: #0f5ba7;
      --blue-dark: #0a467f;
      --blue-soft: #eaf3fb;
      --green: #2f7d32;
      --green-soft: #edf7ee;

      --text: #17212b;
      --field-text: #4b5563;
      --placeholder: #4b5563;
      --muted: #697783;

      --line: #dce5ec;
      --background: #f3f6f8;
      --white: #ffffff;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--background);
      color: var(--text);
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    input,
    select,
    button {
      font: inherit;
    }

    .container {
      width: min(100% - 24px, 920px);
      margin: 0 auto;
      padding: 20px 0 40px;
    }

    .hero,
    .card,
    .results {
      border-radius: 18px;
      background: var(--white);
      box-shadow:
        0 18px 46px rgba(19, 70, 105, 0.12);
    }

    .hero {
      padding: 0;
      overflow: hidden;
      background: var(--white);
      line-height: 0;
    }

    .hero-banner {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .card,
    .results {
      margin-top: 20px;
      padding: 30px;
    }

    h2 {
      margin: 0 0 24px;
      color: var(--blue);
      font-size: 26px;
      line-height: 1.2;
    }

    h3 {
      margin: 0 0 12px;
      color: var(--blue);
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
    }

    input,
    select {
      width: 100%;
      min-height: 50px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--white);

      color: var(--field-text);
      -webkit-text-fill-color: var(--field-text);

      font-weight: 600;
      outline: none;
    }

    input {
      color: var(--field-text);
      -webkit-text-fill-color: var(--field-text);
    }

    input::placeholder {
      color: var(--placeholder);
      opacity: 1;
      font-weight: 600;
    }

    select {
      cursor: pointer;
      color: var(--field-text);
      -webkit-text-fill-color: var(--field-text);
    }

    select:required:invalid {
      color: var(--placeholder);
      -webkit-text-fill-color: var(--placeholder);
    }

    select option {
      color: var(--field-text) !important;
      background: var(--white);
      font-weight: 600;
    }

    select option[value=""] {
      color: var(--placeholder) !important;
    }

    input:focus,
    select:focus {
      border-color: var(--blue);
      box-shadow:
        0 0 0 4px rgba(15, 91, 167, 0.12);
    }

    select:disabled {
      cursor: not-allowed;
      background: #f0f3f5;
      color: var(--field-text);
      opacity: 1;
      -webkit-text-fill-color: var(--field-text);
    }

    .privacy {
      margin-top: 20px;
      padding: 14px 16px;
      border: 1px solid #cae3cc;
      border-radius: 12px;
      background: var(--green-soft);
      color: #245f28;
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 22px;
    }

    button {
      min-height: 50px;
      padding: 12px 22px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 800;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .primary {
      flex: 1;
      background: var(--blue);
      color: var(--white);
    }

    .primary:hover {
      background: var(--blue-dark);
    }

    .secondary {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--blue);
    }

    .stop-button {
      border: 1px solid #86c98b;
      background: var(--green-soft);
      color: var(--green);
    }

    .stop-button:hover {
      background: #dff0e1;
    }

    .error.retrying {
      background: #fff8e6;
      color: #805b00;
    }

    .recommendation-note {
      margin-top: 16px;
      padding: 16px;
      border: 1px solid #cae3cc;
      border-left: 4px solid var(--green);
      border-radius: 10px;
      background: var(--green-soft);
      color: #245f28;
      font-weight: 700;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .error {
      margin-bottom: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #fef3f2;
      color: var(--danger);
      font-weight: 700;
    }

    .metrics {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .metric {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .metric.featured {
      background: var(--blue-soft);
      border-color: rgba(15, 91, 167, 0.28);
    }

    .metric span {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .metric strong {
      color: var(--blue);
      font-size: 25px;
    }

    .status,
    .panel {
      margin-top: 16px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .status {
      background: #f8fafb;
      font-size: 17px;
      font-weight: 800;
    }

    .products {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .product {
      padding: 16px;
      border: 1px solid rgba(15, 91, 167, 0.18);
      border-radius: 12px;
      background: #f8fbfe;
    }

    .product strong {
      color: var(--blue);
    }

    .product p {
      margin: 7px 0 0;
      color: var(--muted);
    }

    .soil-active {
      margin-top: 18px;
      padding: 16px;
      border-left: 4px solid var(--green);
      border-radius: 8px;
      background: var(--green-soft);
    }

    .soil-active p {
      margin: 6px 0 0;
    }

    .disclaimer {
      color: var(--muted);
      font-size: 12px;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 700px) {
      .container {
        width: min(100% - 16px, 920px);
        padding-top: 8px;
        padding-bottom:
          calc(
            96px +
            env(safe-area-inset-bottom)
          );
      }

      .hero,
      .card,
      .results {
        border-radius: 15px;
      }

      .hero {
        padding: 0;
      }

      .hero-banner {
        width: 100%;
        height: auto;
      }

      .card,
      .results {
        padding: 22px 18px;
      }

      h2 {
        margin-bottom: 22px;
        font-size: 24px;
      }

      .grid,
      .metrics {
        grid-template-columns: 1fr;
      }

      .grid {
        gap: 20px;
      }

      label {
        gap: 9px;
        font-size: 15px;
      }

      input,
      select {
        min-height: 58px;
        padding: 15px 16px;
        font-size: 16px;
      }

      .privacy {
        padding: 15px 16px;
        font-size: 14px;
        line-height: 1.55;
      }

      .actions {
        position: sticky;
        bottom: max(
          8px,
          env(safe-area-inset-bottom)
        );
        z-index: 30;
        flex-direction: column;
        padding: 10px;
        margin-right: -10px;
        margin-left: -10px;
        border: 1px solid rgba(220, 229, 236, 0.92);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow:
          0 -10px 30px rgba(19, 70, 105, 0.14);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      button {
        width: 100%;
        min-height: 56px;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <section
      class="hero"
      aria-label="Bactogran Field Advisor — Цифровий помічник"
    >
      <img
        class="hero-banner"
        src="https://bactogran-demo-u2za.vercel.app/IMG_5782.PNG"
        onerror="
          this.onerror = null;
          this.src = './IMG_5782.PNG';
        "
        alt="Bactogran Field Advisor — цифровий помічник для точного розрахунку фосфорного живлення"
      >
    </section>

    <section class="card">
      <h2>Параметри поля</h2>

      <div
        id="error"
        class="error"
        role="alert"
        hidden
      ></div>

      <form id="calculatorForm">
        <div class="grid">

          <label>
            Площа поля, га

            <input
              id="area"
              type="text"
              inputmode="decimal"
              placeholder="Наприклад, 250"
              autocomplete="off"
              required
            >
          </label>

          <label>
            Культура

            <select
              id="crop"
              required
            >
              <option
                value=""
                disabled
                selected
              >
                Завантаження…
              </option>
            </select>
          </label>

          <label>
            Запланована врожайність, т/га

            <select
              id="plannedYield"
              disabled
              required
            >
              <option
                value=""
                disabled
                selected
              >
                Спочатку оберіть культуру
              </option>
            </select>
          </label>

          <label>
            Забезпеченість ґрунту фосфором

            <select
              id="soilP"
              required
            >
              <option
                value=""
                disabled
                selected
              >
                Завантаження…
              </option>
            </select>
          </label>

          <label>
            pH ґрунту

            <select
              id="pH"
              required
            >
              <option
                value=""
                disabled
                selected
              >
                Завантаження…
              </option>
            </select>
          </label>

        </div>

        <div
          id="privacyText"
          class="privacy"
        >
          Розрахунок виконується через персональне
          захищене посилання.
        </div>

        <div class="actions">
          <button
            id="calculateButton"
            class="primary"
            type="submit"
          >
            Розрахувати
          </button>

          <button
            id="stopButton"
            class="stop-button"
            type="button"
            hidden
          >
            Зупинити розрахунок
          </button>

          <button
            id="clearButton"
            class="secondary"
            type="button"
          >
            Очистити
          </button>
        </div>
      </form>
    </section>

    <section
      id="results"
      class="results"
      hidden
    >
      <h2>Результат розрахунку</h2>

      <div class="metrics">

        <article class="metric">
          <span>Винос P₂O₅ із урожаєм</span>
          <strong id="removal">—</strong>
        </article>

        <article class="metric featured">
          <span>Рекомендована норма P₂O₅</span>
          <strong id="recommendation">—</strong>
        </article>

        <article class="metric">
          <span>Загальна потреба P₂O₅</span>
          <strong id="total">—</strong>
        </article>

      </div>

      <div
        id="status"
        class="status"
      ></div>

      <article class="panel">
        <h3 id="explanationTitle">
          Доступні рішення Bactogran
        </h3>

        <p id="explanationIntro"></p>

        <div
          id="products"
          class="products"
        ></div>

        <p
          id="productsFallback"
          hidden
        ></p>

        <div
          id="bactogranNotice"
          class="recommendation-note"
        ></div>

        <div class="soil-active">
          <strong>
            Біокомплекс Soil Active
          </strong>

          <p id="soilActive"></p>
        </div>
      </article>

      <article class="panel">
        <h3>
          Агрономічний висновок
        </h3>

        <p id="comment"></p>
      </article>

      <p
        id="disclaimer"
        class="disclaimer"
      ></p>
    </section>

  </main>

  <script>
    let appData = null;
    let isSubmitting = false;
    let stopRequested = false;
    let activeRequestController = null;
    let activeRequestId = null;

    const params =
      new URLSearchParams(
        window.location.search
      );

    const token =
      params.get('token');

    const API_URL =
      '/api/calculate';

    const form =
      document.getElementById(
        'calculatorForm'
      );

    const area =
      document.getElementById(
        'area'
      );

    const crop =
      document.getElementById(
        'crop'
      );

    const plannedYield =
      document.getElementById(
        'plannedYield'
      );

    const soilP =
      document.getElementById(
        'soilP'
      );

    const pH =
      document.getElementById(
        'pH'
      );

    const calculateButton =
      document.getElementById(
        'calculateButton'
      );

    const clearButton =
      document.getElementById(
        'clearButton'
      );

    const stopButton =
      document.getElementById(
        'stopButton'
      );

    const bactogranNotice =
      document.getElementById(
        'bactogranNotice'
      );

    const errorBox =
      document.getElementById(
        'error'
      );

    const results =
      document.getElementById(
        'results'
      );


    document.addEventListener(
      'DOMContentLoaded',
      loadApp
    );


    function loadApp() {
      setLoading(
        true,
        'Завантаження…'
      );

      const mockData = {
        crops: [
          'Пшениця',
          'Ріпак',
          'Кукурудза',
          'Соняшник',
          'Соя'
        ],

        soilOptions: [
          'Низька',
          'Середня',
          'Висока'
        ],

        phOptions: [
          '5.0',
          '6.0',
          '7.0',
          '8.0'
        ],

        yieldMap: {
          'Пшениця': [
            4, 4.5, 5, 5.5, 6, 6.5,
            7, 7.5, 8, 8.5, 9, 9.5, 10
          ],

          'Ріпак': [
            1.5, 2, 2.5, 3, 3.5, 4
          ],

          'Кукурудза': [
            4, 4.5, 5, 5.5, 6, 6.5,
            7, 7.5, 8, 8.5, 9, 9.5,
            10, 10.5, 11, 11.5, 12
          ],

          'Соняшник': [
            1.5, 2, 2.5, 3, 3.5, 4
          ],

          'Соя': [
            1.5, 2, 2.5, 3, 3.5, 4
          ]
        },

        privacyText:
          'Розрахунок виконується через персональне захищене посилання та зберігається в CRM Bactogran.',

        disclaimer:
          '* Рекомендована норма розрахована на основі середніх показників.'
      };

      window.setTimeout(
        function () {
          setupApp(mockData);
        },
        300
      );
    }


    function setupApp(data) {
      appData = data;

      fillSelect(
        crop,
        data.crops,
        'Оберіть культуру'
      );

      fillSelect(
        soilP,
        data.soilOptions,
        'Оберіть показник'
      );

      fillSelect(
        pH,
        data.phOptions,
        'Оберіть pH'
      );

      document
        .getElementById(
          'privacyText'
        )
        .textContent =
          data.privacyText;

      document
        .getElementById(
          'disclaimer'
        )
        .textContent =
          data.disclaimer;

      setLoading(false);
    }


    crop.addEventListener(
      'change',
      function () {
        const selectedCrop =
          crop.value;

        const options =
          appData.yieldMap[
            selectedCrop
          ] || [];

        plannedYield.replaceChildren();

        const placeholder =
          document.createElement(
            'option'
          );

        placeholder.value = '';

        placeholder.textContent =
          selectedCrop
            ? 'Оберіть урожайність'
            : 'Спочатку оберіть культуру';

        placeholder.disabled = true;
        placeholder.selected = true;

        plannedYield.appendChild(
          placeholder
        );

        options.forEach(
          function (value) {
            const option =
              document.createElement(
                'option'
              );

            option.value =
              String(value);

            option.textContent =
              formatNumber(value);

            plannedYield.appendChild(
              option
            );
          }
        );

        plannedYield.disabled =
          !selectedCrop ||
          options.length === 0;

        results.hidden = true;
        hideError();
      }
    );


    form.addEventListener(
      'submit',
      async function (event) {
        event.preventDefault();

        if (isSubmitting) {
          return;
        }

        hideError();

        if (!token) {
          showServerError({
            message:
              'Персональне посилання не містить токена.'
          });

          return;
        }

        const areaValue =
          Number(
            String(area.value)
              .trim()
              .replace(',', '.')
          );

        const yieldValue =
          Number(
            plannedYield.value
          );

        if (
          !Number.isFinite(
            areaValue
          ) ||
          areaValue <= 0
        ) {
          showServerError({
            message:
              'Вкажіть коректну площу поля.'
          });

          return;
        }

        if (!crop.value) {
          showServerError({
            message:
              'Оберіть культуру.'
          });

          return;
        }

        if (
          !Number.isFinite(
            yieldValue
          ) ||
          yieldValue <= 0
        ) {
          showServerError({
            message:
              'Оберіть заплановану врожайність.'
          });

          return;
        }

        const allowedYields =
          appData.yieldMap[
            crop.value
          ] || [];

        const yieldExists =
          allowedYields.some(
            function (value) {
              return Number(value) ===
                yieldValue;
            }
          );

        if (!yieldExists) {
          showServerError({
            message:
              'Обрана врожайність не відповідає вибраній культурі.'
          });

          return;
        }

        if (!soilP.value) {
          showServerError({
            message:
              'Оберіть забезпеченість ґрунту фосфором.'
          });

          return;
        }

        if (!pH.value) {
          showServerError({
            message:
              'Оберіть pH ґрунту.'
          });

          return;
        }

        const requestId =
          createRequestId();

        const input = {
          requestId:
            requestId,

          token:
            token,

          area:
            areaValue,

          crop:
            crop.value,

          plannedYield:
            yieldValue,

          soilP:
            soilP.value,

          pH:
            pH.value
        };

        isSubmitting = true;
        stopRequested = false;
        activeRequestId =
          requestId;

        setLoading(
          true,
          'Розрахунок…'
        );

        try {
          const result =
            await fetchCalculationUntilSuccess(
              input
            );

          const data =
            result.data || {};

          const orderedProducts =
            Array.isArray(
              data.products
            )
              ? data.products
                  .slice()
                  .sort(
                    function (
                      firstProduct,
                      secondProduct
                    ) {
                      return (
                        getProductOrder(
                          firstProduct
                        ) -
                        getProductOrder(
                          secondProduct
                        )
                      );
                    }
                  )
              : [];

          const recommendationValue =
            Number(
              data.recommendationP2O5
            );

          const statusText =
            data.statusText ||
            data.status ||
            '';

          const lowNeed =
            String(
              statusText
            ).includes(
              'Низька'
            ) ||
            (
              Number.isFinite(
                recommendationValue
              ) &&
              recommendationValue <= 10
            );

          const mappedProducts =
            orderedProducts.map(
              function (product) {
                return {
                  name:
                    product.name ||
                    product.shortName ||
                    'Bactogran',

                  rate:
                    Number(
                      product.rate
                    ),

                  rateLabel:
                    product.rateLabel ||
                    (
                      product.rate !== undefined
                        ? `${formatNumber(product.rate)} кг/га`
                        : ''
                    ),

                  totalLabel:
                    product.totalLabel ||
                    (
                      product.totalTons !== undefined
                        ? `${formatNumber(product.totalTons)} т на площу ${formatNumber(input.area)} га`
                        : ''
                    )
                };
              }
            );

          const displayProducts =
            mappedProducts.length
              ? mappedProducts
              : [
                  {
                    name:
                      lowNeed
                        ? 'Підтримувальна рекомендація Bactogran'
                        : 'Індивідуальна рекомендація Bactogran',

                    rateLabel:
                      data.recommendationLabel
                        ? `Розрахункова потреба: ${data.recommendationLabel} P₂O₅`
                        : 'Норма визначається за розрахованою потребою P₂O₅',

                    totalLabel:
                      lowNeed
                        ? 'За достатнього забезпечення фосфором використовуйте лише помірну підтримувальну норму. Не збільшуйте внесення без аналізу ґрунту та консультації агронома.'
                        : 'Конкретний продукт Bactogran і його продуктову норму слід підібрати за розрахованою потребою P₂O₅ та підтвердити з агрономом.'
                  }
                ];

          const recommendationNotice =
            lowNeed
              ? (
                  'Фосфору в ґрунті достатньо або потреба є низькою. ' +
                  'Рекомендується помірне підтримувальне внесення Bactogran ' +
                  'лише в межах мінімальної розрахункової потреби P₂O₅. ' +
                  'Не перевищуйте цю норму без актуального аналізу ґрунту.'
                )
              : (
                  'Рекомендація Bactogran сформована відповідно до розрахованої ' +
                  'потреби культури у P₂O₅. Дотримуйтеся розрахованої норми, ' +
                  'а збільшення внесення погоджуйте з агрономом.'
                );

          const formattedResult = {
            removalLabel:
              data.removalLabel ||
              '—',

            recommendationLabel:
              data.recommendationLabel ||
              '—',

            totalP2O5Label:
              data.totalP2O5Label ||
              '—',

            status:
              statusText,

            comment:
              data.comment ||
              '',

            recommendationNotice:
              recommendationNotice,

            explanation: {
              title:
                'Доступні рішення Bactogran для забезпечення потреби культури у фосфорі',

              intro:
                `Для досягнення запланованої врожайності ` +
                `${input.crop.toLowerCase()} ` +
                `${formatNumber(input.plannedYield)} т/га ` +
                `можна обрати один із наведених продуктів Bactogran:`,

              fallback:
                'Для цього розрахунку сформована підтримувальна рекомендація Bactogran.',

              soilActive:
                'Біокомплекс Soil Active додатково мобілізує 10 кг/га доступного фосфору та попереджає його блокування на кислих і лужних ґрунтах. Це сприяє розвитку кореневої системи, ефективнішому використанню елементів живлення та стабільному формуванню запланованого врожаю.'
            },

            products:
              displayProducts
          };

          showResult(
            formattedResult
          );

        } catch (error) {
          if (
            error &&
            error.code ===
              'USER_STOPPED'
          ) {
            showServerError({
              message:
                'Повторні спроби зупинено. Дані форми збережено — розрахунок можна запустити знову.'
            });
          } else {
            showServerError(
              error
            );
          }

        } finally {
          isSubmitting = false;
          stopRequested = false;
          activeRequestController = null;
          activeRequestId = null;

          setLoading(
            false
          );
        }
      }
    );


    async function fetchCalculationUntilSuccess(
      input
    ) {
      let attempt = 0;

      while (!stopRequested) {
        attempt += 1;

        await waitForOnline();

        if (stopRequested) {
          throw createStoppedError();
        }

        let timeoutReached =
          false;

        const controller =
          new AbortController();

        activeRequestController =
          controller;

        const timeoutId =
          window.setTimeout(
            function () {
              timeoutReached =
                true;

              controller.abort();
            },
            45000
          );

        try {
          showRetryStatus(
            attempt === 1
              ? 'Виконуємо розрахунок…'
              : `Повторна спроба №${attempt}. Дані форми збережено.`
          );

          const response =
            await fetch(
              API_URL,
              {
                method:
                  'POST',

                headers: {
                  'Content-Type':
                    'application/json',

                  'X-Request-Id':
                    input.requestId
                },

                body:
                  JSON.stringify(
                    input
                  ),

                cache:
                  'no-store',

                credentials:
                  'same-origin',

                signal:
                  controller.signal
              }
            );

          const responseText =
            await response.text();

          let result;

          try {
            result =
              JSON.parse(
                responseText
              );
          } catch (parseError) {
            const invalidResponseError =
              new Error(
                'Сервер повернув некоректну відповідь.'
              );

            invalidResponseError.retryable =
              true;

            invalidResponseError.code =
              'NON_JSON_RESPONSE';

            throw invalidResponseError;
          }

          if (
            result &&
            result.status ===
              'active'
          ) {
            const wrongRouteError =
              new Error(
                'Сервер тимчасово відкрив перевірочний маршрут замість розрахунку.'
              );

            wrongRouteError.retryable =
              true;

            wrongRouteError.code =
              'GET_INSTEAD_OF_POST';

            throw wrongRouteError;
          }

          if (
            isRetryableHttpStatus(
              response.status
            ) ||
            (
              result &&
              result.retryable ===
                true
            )
          ) {
            const retryableError =
              new Error(
                result &&
                result.message
                  ? result.message
                  : 'Тимчасова помилка сервера.'
              );

            retryableError.retryable =
              true;

            retryableError.code =
              result &&
              result.code
                ? result.code
                : `HTTP_${response.status}`;

            throw retryableError;
          }

          if (
            !response.ok ||
            !result ||
            result.status !==
              'success'
          ) {
            throw new Error(
              result &&
              result.message
                ? result.message
                : 'Не вдалося виконати розрахунок.'
            );
          }

          return result;

        } catch (error) {
          if (stopRequested) {
            throw createStoppedError();
          }

          const retryable =
            timeoutReached ||
            isRetryableFetchError(
              error
            );

          if (!retryable) {
            throw normalizeFetchError(
              error
            );
          }

          const delay =
            getRetryDelay(
              attempt
            );

          showRetryStatus(
            timeoutReached
              ? (
                  `Сервер відповідає довше звичайного. ` +
                  `Наступна спроба через ${Math.ceil(delay / 1000)} с.`
                )
              : (
                  `З’єднання тимчасово перервано. ` +
                  `Наступна спроба через ${Math.ceil(delay / 1000)} с.`
                )
          );

          await waitWithStop(
            delay
          );

        } finally {
          window.clearTimeout(
            timeoutId
          );

          if (
            activeRequestController ===
            controller
          ) {
            activeRequestController =
              null;
          }
        }
      }

      throw createStoppedError();
    }


    function createRequestId() {
      if (
        window.crypto &&
        typeof window.crypto.randomUUID ===
          'function'
      ) {
        return (
          'bcg-' +
          window.crypto.randomUUID()
        );
      }

      return (
        'bcg-' +
        Date.now().toString(36) +
        '-' +
        Math.random()
          .toString(36)
          .slice(2) +
        '-' +
        Math.random()
          .toString(36)
          .slice(2)
      );
    }


    function createStoppedError() {
      const error =
        new Error(
          'Повторні спроби зупинено.'
        );

      error.code =
        'USER_STOPPED';

      return error;
    }


    function isRetryableHttpStatus(
      status
    ) {
      return [
        408,
        425,
        429,
        500,
        502,
        503,
        504
      ].includes(
        Number(status)
      );
    }


    function isRetryableFetchError(
      error
    ) {
      if (!error) {
        return true;
      }

      if (
        error.retryable ===
          true
      ) {
        return true;
      }

      if (
        error.name ===
          'AbortError'
      ) {
        return true;
      }

      const message =
        String(
          error.message ||
          error
        )
          .toLowerCase();

      return (
        message.includes(
          'failed to fetch'
        ) ||
        message.includes(
          'networkerror'
        ) ||
        message.includes(
          'network error'
        ) ||
        message.includes(
          'load failed'
        ) ||
        message.includes(
          'fetch'
        )
      );
    }


    function normalizeFetchError(
      error
    ) {
      const normalized =
        new Error(
          error &&
          error.message
            ? error.message
            : 'Не вдалося виконати розрахунок.'
        );

      normalized.code =
        error &&
        error.code
          ? error.code
          : 'CALCULATION_ERROR';

      return normalized;
    }


    function getRetryDelay(
      attempt
    ) {
      const baseDelay =
        Math.min(
          15000,
          1200 *
          Math.pow(
            1.7,
            Math.max(
              0,
              attempt - 1
            )
          )
        );

      const jitter =
        Math.floor(
          Math.random() *
          700
        );

      return (
        Math.round(
          baseDelay
        ) +
        jitter
      );
    }


    async function waitForOnline() {
      while (
        navigator.onLine ===
          false &&
        !stopRequested
      ) {
        showRetryStatus(
          'Немає з’єднання з інтернетом. Очікуємо відновлення Wi‑Fi або мобільної мережі…'
        );

        await waitWithStop(
          1000
        );
      }
    }


    function waitWithStop(
      milliseconds
    ) {
      return new Promise(
        function (resolve) {
          const startedAt =
            Date.now();

          function check() {
            if (
              stopRequested ||
              Date.now() -
                startedAt >=
                milliseconds
            ) {
              resolve();
              return;
            }

            window.setTimeout(
              check,
              250
            );
          }

          check();
        }
      );
    }


    function showRetryStatus(
      message
    ) {
      errorBox.classList.add(
        'retrying'
      );

      errorBox.textContent =
        message;

      errorBox.hidden =
        false;
    }


    function stopActiveRetries() {
      if (!isSubmitting) {
        return;
      }

      stopRequested =
        true;

      if (
        activeRequestController
      ) {
        activeRequestController.abort();
      }
    }


    function restoreMobileControls() {
      if (isSubmitting) {
        setLoading(
          true,
          'Розрахунок…'
        );
      } else {
        setLoading(
          false
        );
      }
    }


    stopButton.addEventListener(
      'click',
      stopActiveRetries
    );


    window.addEventListener(
      'pageshow',
      restoreMobileControls
    );


    document.addEventListener(
      'visibilitychange',
      function () {
        if (!document.hidden) {
          restoreMobileControls();
        }
      }
    );


    window.addEventListener(
      'online',
      function () {
        if (isSubmitting) {
          showRetryStatus(
            'Інтернет-з’єднання відновлено. Продовжуємо розрахунок…'
          );
        }
      }
    );


    clearButton.addEventListener(
      'click',
      clearForm
    );


    function getProductOrder(
      product
    ) {
      const productName =
        String(
          product.name ||
          product.shortName ||
          ''
        )
          .toUpperCase()
          .replace(/\s+/g, ' ')
          .trim();

      if (
        productName.includes(
          'NP 4.28'
        )
      ) {
        return 1;
      }

      if (
        productName.includes(
          'NPK 5.16.7'
        )
      ) {
        return 2;
      }

      if (
        productName.includes(
          'NKS 8.10.22'
        )
      ) {
        return 3;
      }

      return 100;
    }


    function showResult(result) {
      document
        .getElementById(
          'removal'
        )
        .textContent =
          result.removalLabel;

      document
        .getElementById(
          'recommendation'
        )
        .textContent =
          result.recommendationLabel;

      document
        .getElementById(
          'total'
        )
        .textContent =
          result.totalP2O5Label;

      document
        .getElementById(
          'status'
        )
        .textContent =
          result.status;

      document
        .getElementById(
          'explanationTitle'
        )
        .textContent =
          result.explanation.title;

      document
        .getElementById(
          'explanationIntro'
        )
        .textContent =
          result.explanation.intro;

      document
        .getElementById(
          'soilActive'
        )
        .textContent =
          result.explanation.soilActive;

      document
        .getElementById(
          'comment'
        )
        .textContent =
          result.comment;

      bactogranNotice.textContent =
        result.recommendationNotice ||
        '';

      renderProducts(
        result.products,
        result.explanation.fallback
      );

      results.hidden = false;

      setLoading(false);
      hideError();

      results.scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });
    }


    function renderProducts(
      products,
      fallback
    ) {
      const container =
        document.getElementById(
          'products'
        );

      const fallbackElement =
        document.getElementById(
          'productsFallback'
        );

      container.replaceChildren();

      if (!products.length) {
        fallbackElement.textContent =
          fallback;

        fallbackElement.hidden =
          false;

        return;
      }

      fallbackElement.hidden =
        true;

      products.forEach(
        function (product) {
          const card =
            document.createElement(
              'article'
            );

          card.className =
            'product';

          const title =
            document.createElement(
              'strong'
            );

          title.textContent =
            product.name;

          const rate =
            document.createElement(
              'p'
            );

          const details = [
            product.rateLabel,
            product.totalLabel
          ].filter(Boolean);

          rate.textContent =
            details.join(' · ');

          card.append(
            title,
            rate
          );

          container.appendChild(
            card
          );
        }
      );
    }


    function fillSelect(
      selectElement,
      values,
      placeholderText
    ) {
      selectElement.replaceChildren();

      const placeholder =
        document.createElement(
          'option'
        );

      placeholder.value = '';

      placeholder.textContent =
        placeholderText;

      placeholder.disabled = true;
      placeholder.selected = true;

      selectElement.appendChild(
        placeholder
      );

      values.forEach(
        function (value) {
          const option =
            document.createElement(
              'option'
            );

          option.value =
            String(value);

          option.textContent =
            String(value);

          selectElement.appendChild(
            option
          );
        }
      );
    }


    function clearForm() {
      form.reset();

      plannedYield.replaceChildren();

      const option =
        document.createElement(
          'option'
        );

      option.value = '';

      option.textContent =
        'Спочатку оберіть культуру';

      option.disabled = true;
      option.selected = true;

      plannedYield.appendChild(
        option
      );

      plannedYield.disabled =
        true;

      results.hidden =
        true;

      bactogranNotice.textContent =
        '';

      hideError();

      area.focus();
    }


    function setLoading(
      loading,
      text
    ) {
      calculateButton.disabled =
        loading;

      clearButton.disabled =
        loading;

      stopButton.hidden =
        !loading;

      stopButton.disabled =
        false;

      calculateButton.textContent =
        loading
          ? (
              text ||
              'Розрахунок…'
            )
          : 'Розрахувати';
    }


    function showServerError(error) {
      errorBox.classList.remove(
        'retrying'
      );

      errorBox.textContent =
        error &&
        error.message
          ? error.message
          : 'Виникла помилка. Повторіть спробу.';

      errorBox.hidden =
        false;

      errorBox.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
      });
    }


    function hideError() {
      errorBox.classList.remove(
        'retrying'
      );

      errorBox.hidden =
        true;

      errorBox.textContent =
        '';
    }


    function formatNumber(value) {
      const number =
        Number(value);

      if (
        !Number.isFinite(
          number
        )
      ) {
        return value;
      }

      return Number.isInteger(
        number
      )
        ? String(number)
        : number
            .toFixed(1)
            .replace('.', ',');
    }
  </script>
</body>
