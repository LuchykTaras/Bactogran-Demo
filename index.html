<!DOCTYPE html>
<html lang="uk">
<head>
  <base target="_top">

  <title>
    Bactogran Field Advisor — Цифровий помічник
  </title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <style>
    :root {
      --blue: #0f5ba7;
      --blue-dark: #0a467f;
      --blue-soft: #eaf3fb;
      --green: #2f7d32;
      --green-soft: #edf7ee;

      /* Основний колір тексту і назв над полями */
      --text: #17212b;
      --label: #111827;

      /* Темно-сірий колір значень усередині полів */
      --field-text: #4b5563;
      --placeholder: #4b5563;

      --muted: #697783;
      --line: #dce5ec;
      --background: #f3f6f8;
      --white: #ffffff;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--background);
      color: var(--text);
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    input,
    select,
    button {
      font: inherit;
    }

    .container {
      width: min(100% - 24px, 920px);
      margin: 0 auto;
      padding: 20px 0 40px;
    }

    .hero,
    .card,
    .results {
      border-radius: 18px;
      background: var(--white);
      box-shadow:
        0 18px 46px rgba(19, 70, 105, 0.12);
    }

    .hero {
      padding: 0;
      overflow: hidden;
      background: var(--white);
      color: inherit;
      line-height: 0;
    }

    .hero-banner {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .card,
    .results {
      margin-top: 20px;
      padding: 30px;
    }

    h2 {
      margin: 0 0 24px;
      color: var(--blue);
      font-size: 26px;
      line-height: 1.2;
    }

    h3 {
      margin: 0 0 12px;
      color: var(--blue);
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    /* Назви над полями залишаються в оригінальному кольорі */
    label {
      display: grid;
      gap: 8px;
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
    }

    /*
     * Введена площа та вибрані значення
     * відображаються темно-сірим кольором.
     */
    input,
    select {
      width: 100%;
      min-height: 50px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--white);
      color: var(--field-text);
      -webkit-text-fill-color: var(--field-text);
      font-weight: 600;
      outline: none;
    }

    input {
      color: var(--field-text);
      -webkit-text-fill-color: var(--field-text);
      font-weight: 600;
    }

    select {
      cursor: pointer;
      color: var(--field-text);
      -webkit-text-fill-color: var(--field-text);
      font-weight: 600;
    }

    /* Підказка у полі площі */
    input::placeholder {
      color: var(--placeholder);
      opacity: 1;
      font-weight: 600;
    }

    /*
     * Підказки в select:
     * «Оберіть культуру»,
     * «Оберіть показник»,
     * «Оберіть pH» тощо.
     */
    select:required:invalid {
      color: var(--placeholder);
      -webkit-text-fill-color: var(--placeholder);
      font-weight: 600;
    }

    /*
     * Усі значення у відкритих списках:
     * культури, урожайність, забезпеченість і pH.
     */
    select option {
      color: var(--field-text) !important;
      background: var(--white);
      font-weight: 600;
    }

    select option[value=""] {
      color: var(--placeholder) !important;
    }

    input:focus,
    select:focus {
      border-color: var(--blue);
      box-shadow:
        0 0 0 4px rgba(15, 91, 167, 0.12);
    }

    select:disabled {
      cursor: not-allowed;
      background: #f0f3f5;
      color: var(--field-text);
      opacity: 1;
      -webkit-text-fill-color: var(--field-text);
    }

    .privacy {
      margin-top: 20px;
      padding: 14px 16px;
      border: 1px solid #cae3cc;
      border-radius: 12px;
      background: var(--green-soft);
      color: #245f28;
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 22px;
    }

    button {
      min-height: 50px;
      padding: 12px 22px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 800;
    }

    .primary {
      flex: 1;
      background: var(--blue);
      color: var(--white);
    }

    .primary:hover {
      background: var(--blue-dark);
    }

    .secondary {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--blue);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .error {
      margin-bottom: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #fef3f2;
      color: var(--danger);
      font-weight: 700;
    }

    .metrics {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .metric {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .metric.featured {
      background: var(--blue-soft);
      border-color: rgba(15, 91, 167, 0.28);
    }

    .metric span {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .metric strong {
      color: var(--blue);
      font-size: 25px;
    }

    .status,
    .panel {
      margin-top: 16px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .status {
      background: #f8fafb;
      font-size: 17px;
      font-weight: 800;
    }

    .products {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .product {
      padding: 16px;
      border: 1px solid rgba(15, 91, 167, 0.18);
      border-radius: 12px;
      background: #f8fbfe;
    }

    .product strong {
      color: var(--blue);
    }

    .product p {
      margin: 7px 0 0;
      color: var(--muted);
    }

    .soil-active {
      margin-top: 18px;
      padding: 16px;
      border-left: 4px solid var(--green);
      border-radius: 8px;
      background: var(--green-soft);
    }

    .soil-active p {
      margin: 6px 0 0;
    }

    .disclaimer {
      color: var(--muted);
      font-size: 12px;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 700px) {
      .container {
        width: min(100% - 16px, 920px);
        padding-top: 8px;
      }

      .hero,
      .card,
      .results {
        border-radius: 15px;
      }

      .hero {
        padding: 0;
      }

      .hero-banner {
        width: 100%;
        height: auto;
      }

      .card,
      .results {
        padding: 22px 18px;
      }

      h2 {
        margin-bottom: 22px;
        font-size: 24px;
      }

      .grid,
      .metrics {
        grid-template-columns: 1fr;
      }

      .grid {
        gap: 20px;
      }

      label {
        gap: 9px;
        font-size: 15px;
      }

      input,
      select {
        min-height: 56px;
        padding: 14px 16px;
        color: var(--field-text);
        -webkit-text-fill-color: var(--field-text);
        font-size: 16px;
        font-weight: 600;
      }

      .privacy {
        padding: 15px 16px;
        font-size: 14px;
        line-height: 1.55;
      }

      .actions {
        flex-direction: column;
      }

      button {
        width: 100%;
        min-height: 56px;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <section
      class="hero"
      aria-label="Bactogran Field Advisor — Цифровий помічник"
    >
      <img
        class="hero-banner"
        src="https://bactogran-demo-u2za.vercel.app/IMG_5782.PNG"
        onerror="
          this.onerror = null;
          this.src = './IMG_5782.PNG';
        "
        alt="Bactogran Field Advisor — цифровий помічник для точного розрахунку фосфорного живлення"
      >
    </section>

    <section class="card">
      <h2>Параметри поля</h2>

      <div
        id="error"
        class="error"
        role="alert"
        hidden
      ></div>

      <form id="calculatorForm">
        <div class="grid">

          <label>
            Площа поля, га

            <input
              id="area"
              type="text"
              inputmode="decimal"
              placeholder="Наприклад, 250"
              autocomplete="off"
              required
            >
          </label>

          <label>
            Культура

            <select
              id="crop"
              required
            >
              <option
                value=""
                disabled
                selected
              >
                Завантаження…
              </option>
            </select>
          </label>

          <label>
            Запланована врожайність, т/га

            <select
              id="plannedYield"
              disabled
              required
            >
              <option
                value=""
                disabled
                selected
              >
                Спочатку оберіть культуру
              </option>
            </select>
          </label>

          <label>
            Забезпеченість ґрунту фосфором

            <select
              id="soilP"
              required
            >
              <option
                value=""
                disabled
                selected
              >
                Завантаження…
              </option>
            </select>
          </label>

          <label>
            pH ґрунту

            <select
              id="pH"
              required
            >
              <option
                value=""
                disabled
                selected
              >
                Завантаження…
              </option>
            </select>
          </label>

        </div>

        <div
          id="privacyText"
          class="privacy"
        >
          Розрахунок виконується через персональне
          захищене посилання.
        </div>

        <div class="actions">
          <button
            id="calculateButton"
            class="primary"
            type="submit"
          >
            Розрахувати
          </button>

          <button
            id="clearButton"
            class="secondary"
            type="button"
          >
            Очистити
          </button>
        </div>
      </form>
    </section>

    <section
      id="results"
      class="results"
      hidden
    >
      <h2>Результат розрахунку</h2>

      <div class="metrics">

        <article class="metric">
          <span>
            Винос P₂O₅ із урожаєм
          </span>

          <strong id="removal">
            —
          </strong>
        </article>

        <article class="metric featured">
          <span>
            Рекомендована норма P₂O₅
          </span>

          <strong id="recommendation">
            —
          </strong>
        </article>

        <article class="metric">
          <span>
            Загальна потреба P₂O₅
          </span>

          <strong id="total">
            —
          </strong>
        </article>

      </div>

      <div
        id="status"
        class="status"
      ></div>

      <article class="panel">
        <h3 id="explanationTitle">
          Доступні рішення Bactogran
        </h3>

        <p id="explanationIntro"></p>

        <div
          id="products"
          class="products"
        ></div>

        <p
          id="productsFallback"
          hidden
        ></p>

        <div class="soil-active">
          <strong>
            Біокомплекс Soil Active
          </strong>

          <p id="soilActive"></p>
        </div>
      </article>

      <article class="panel">
        <h3>
          Агрономічний висновок
        </h3>

        <p id="comment"></p>
      </article>

      <p
        id="disclaimer"
        class="disclaimer"
      ></p>
    </section>

  </main>

  <script>
    let appData = null;

    const params =
      new URLSearchParams(
        window.location.search
      );

    const token =
      params.get('token');

    const API_URL =
      '/api/calculate';

    const APP_DATA_URL =
      '/api/app-data';

    const form =
      document.getElementById(
        'calculatorForm'
      );

    const area =
      document.getElementById(
        'area'
      );

    const crop =
      document.getElementById(
        'crop'
      );

    const plannedYield =
      document.getElementById(
        'plannedYield'
      );

    const soilP =
      document.getElementById(
        'soilP'
      );

    const pH =
      document.getElementById(
        'pH'
      );

    const calculateButton =
      document.getElementById(
        'calculateButton'
      );

    const clearButton =
      document.getElementById(
        'clearButton'
      );

    const errorBox =
      document.getElementById(
        'error'
      );

    const results =
      document.getElementById(
        'results'
      );


    document.addEventListener(
      'DOMContentLoaded',
      loadApp
    );


    async function loadApp() {
      setLoading(
        true,
        'Завантаження…'
      );

      hideError();

      try {
        const response =
          await fetch(
            APP_DATA_URL,
            {
              method: 'GET',
              headers: {
                'Accept':
                  'application/json'
              },
              cache: 'no-store'
            }
          );

        const responseText =
          await response.text();

        let result;

        try {
          result =
            JSON.parse(
              responseText
            );
        } catch (parseError) {
          throw new Error(
            'Сервер повернув некоректні довідники.'
          );
        }

        if (
          !response.ok ||
          result.status !== 'success' ||
          !result.data
        ) {
          throw new Error(
            result.message ||
            'Не вдалося завантажити довідники калькулятора.'
          );
        }

        setupApp(
          result.data
        );

      } catch (error) {
        showServerError(
          error
        );
      }
    }

    function setupApp(data) {
      appData = data;

      fillSelect(
        crop,
        data.crops,
        'Оберіть культуру'
      );

      fillSelect(
        soilP,
        data.soilOptions,
        'Оберіть показник'
      );

      fillSelect(
        pH,
        data.phOptions,
        'Оберіть pH'
      );

      document
        .getElementById(
          'privacyText'
        )
        .textContent =
          data.privacyText;

      document
        .getElementById(
          'disclaimer'
        )
        .textContent =
          data.disclaimer;

      setLoading(false);
    }


    crop.addEventListener(
      'change',
      function () {
        const options =
          appData.yieldMap[
            crop.value
          ] || [];

        plannedYield.replaceChildren();

        const placeholder =
          document.createElement(
            'option'
          );

        placeholder.value = '';

        placeholder.textContent =
          crop.value
            ? 'Оберіть урожайність'
            : 'Спочатку оберіть культуру';

        placeholder.disabled = true;
        placeholder.selected = true;

        plannedYield.appendChild(
          placeholder
        );

        options.forEach(
          function (value) {
            const option =
              document.createElement(
                'option'
              );

            option.value = value;

            option.textContent =
              formatNumber(value);

            plannedYield.appendChild(
              option
            );
          }
        );

        plannedYield.disabled =
          !crop.value ||
          !options.length;
      }
    );


    form.addEventListener(
      'submit',
      async function (event) {
        event.preventDefault();

        hideError();

        if (!token) {
          showServerError({
            message:
              'Персональне посилання не містить токена.'
          });

          return;
        }

        const areaValue =
          Number(
            String(area.value)
              .trim()
              .replace(',', '.')
          );

        const yieldValue =
          Number(
            plannedYield.value
          );

        if (
          !Number.isFinite(
            areaValue
          ) ||
          areaValue <= 0
        ) {
          showServerError({
            message:
              'Вкажіть коректну площу поля.'
          });

          return;
        }

        if (!crop.value) {
          showServerError({
            message:
              'Оберіть культуру.'
          });

          return;
        }

        if (
          !Number.isFinite(
            yieldValue
          ) ||
          yieldValue <= 0
        ) {
          showServerError({
            message:
              'Оберіть заплановану врожайність.'
          });

          return;
        }

        if (!soilP.value) {
          showServerError({
            message:
              'Оберіть забезпеченість ґрунту фосфором.'
          });

          return;
        }

        if (!pH.value) {
          showServerError({
            message:
              'Оберіть pH ґрунту.'
          });

          return;
        }

        const input = {
          token: token,
          area: areaValue,
          crop: crop.value,
          plannedYield:
            yieldValue,
          soilP: soilP.value,
          pH: pH.value
        };

        setLoading(
          true,
          'Розрахунок…'
        );

        try {
          const response =
            await fetch(
              API_URL,
              {
                method: 'POST',

                headers: {
                  'Content-Type':
                    'application/json'
                },

                body:
                  JSON.stringify(
                    input
                  )
              }
            );

          const responseText =
            await response.text();

          let result;

          try {
            result =
              JSON.parse(
                responseText
              );
          } catch (parseError) {
            throw new Error(
              'Сервер повернув некоректну відповідь.'
            );
          }

          if (
            !response.ok ||
            result.status !==
              'success'
          ) {
            throw new Error(
              result.message ||
              'Не вдалося виконати розрахунок.'
            );
          }

          const data =
            result.data || {};

          const formattedResult = {
            removalLabel:
              data.removalLabel ||
              '—',

            recommendationLabel:
              data.recommendationLabel ||
              '—',

            totalP2O5Label:
              data.totalP2O5Label ||
              '—',

            status:
              data.statusText ||
              data.status ||
              '',

            comment:
              data.comment ||
              '',

            explanation: {
              title:
                'Доступні рішення Bactogran для забезпечення потреби культури у фосфорі',

              intro:
                `Для досягнення запланованої врожайності ` +
                `${input.crop.toLowerCase()} ` +
                `${formatNumber(input.plannedYield)} т/га ` +
                `можна обрати один із наведених продуктів Bactogran:`,

              fallback:
                'Потрібна консультація агронома Bactogran для уточнення системи живлення.',

              soilActive:
                'Біокомплекс Soil Active додатково мобілізує 10 кг/га доступного фосфору та попереджає його блокування на кислих і лужних ґрунтах. Це сприяє розвитку кореневої системи, ефективнішому використанню елементів живлення та стабільному формуванню запланованого врожаю.'
            },

            products:
              Array.isArray(
                data.products
              )
                ? data.products.map(
                    function (
                      product
                    ) {
                      return {
                        name:
                          product.name ||
                          product.shortName ||
                          'Bactogran',

                        rateLabel:
                          product.rateLabel ||
                          (
                            product.rate !==
                              undefined
                              ? `${formatNumber(product.rate)} кг/га`
                              : ''
                          ),

                        totalLabel:
                          product.totalLabel ||
                          (
                            product.totalTons !==
                              undefined
                              ? `${formatNumber(product.totalTons)} т на площу ${formatNumber(input.area)} га`
                              : ''
                          )
                      };
                    }
                  )
                : []
          };

          showResult(
            formattedResult
          );

        } catch (error) {
          showServerError(
            error
          );
        }
      }
    );


    clearButton.addEventListener(
      'click',
      clearForm
    );


    function showResult(result) {
      document
        .getElementById(
          'removal'
        )
        .textContent =
          result.removalLabel;

      document
        .getElementById(
          'recommendation'
        )
        .textContent =
          result.recommendationLabel;

      document
        .getElementById(
          'total'
        )
        .textContent =
          result.totalP2O5Label;

      document
        .getElementById(
          'status'
        )
        .textContent =
          result.status;

      document
        .getElementById(
          'explanationTitle'
        )
        .textContent =
          result.explanation.title;

      document
        .getElementById(
          'explanationIntro'
        )
        .textContent =
          result.explanation.intro;

      document
        .getElementById(
          'soilActive'
        )
        .textContent =
          result.explanation.soilActive;

      document
        .getElementById(
          'comment'
        )
        .textContent =
          result.comment;

      renderProducts(
        result.products,
        result.explanation.fallback
      );

      results.hidden = false;

      setLoading(false);
      hideError();

      results.scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });
    }


    function renderProducts(
      products,
      fallback
    ) {
      const container =
        document.getElementById(
          'products'
        );

      const fallbackElement =
        document.getElementById(
          'productsFallback'
        );

      container.replaceChildren();

      if (!products.length) {
        fallbackElement.textContent =
          fallback;

        fallbackElement.hidden =
          false;

        return;
      }

      fallbackElement.hidden =
        true;

      products.forEach(
        function (product) {
          const card =
            document.createElement(
              'article'
            );

          card.className =
            'product';

          const title =
            document.createElement(
              'strong'
            );

          title.textContent =
            product.name;

          const rate =
            document.createElement(
              'p'
            );

          const details = [
            product.rateLabel,
            product.totalLabel
          ].filter(Boolean);

          rate.textContent =
            details.join(' · ');

          card.append(
            title,
            rate
          );

          container.appendChild(
            card
          );
        }
      );
    }


    function fillSelect(
      selectElement,
      values,
      placeholderText
    ) {
      selectElement.replaceChildren();

      const placeholder =
        document.createElement(
          'option'
        );

      placeholder.value = '';

      placeholder.textContent =
        placeholderText;

      placeholder.disabled = true;
      placeholder.selected = true;

      selectElement.appendChild(
        placeholder
      );

      values.forEach(
        function (value) {
          const option =
            document.createElement(
              'option'
            );

          option.value = value;
          option.textContent = value;

          selectElement.appendChild(
            option
          );
        }
      );
    }


    function clearForm() {
      form.reset();

      plannedYield.replaceChildren();

      const option =
        document.createElement(
          'option'
        );

      option.value = '';

      option.textContent =
        'Спочатку оберіть культуру';

      option.disabled = true;
      option.selected = true;

      plannedYield.appendChild(
        option
      );

      plannedYield.disabled =
        true;

      results.hidden =
        true;

      hideError();

      area.focus();
    }


    function setLoading(
      loading,
      text
    ) {
      calculateButton.disabled =
        loading;

      clearButton.disabled =
        loading;

      calculateButton.textContent =
        loading
          ? text
          : 'Розрахувати';
    }


    function showServerError(error) {
      setLoading(false);

      errorBox.textContent =
        error &&
        error.message
          ? error.message
          : 'Виникла помилка. Повторіть спробу.';

      errorBox.hidden =
        false;

      errorBox.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
      });
    }


    function hideError() {
      errorBox.hidden =
        true;

      errorBox.textContent =
        '';
    }


    function formatNumber(value) {
      const number =
        Number(value);

      if (
        !Number.isFinite(
          number
        )
      ) {
        return value;
      }

      return Number.isInteger(
        number
      )
        ? String(number)
        : number
            .toFixed(1)
            .replace('.', ',');
    }
  </script>
</body>
</html>
